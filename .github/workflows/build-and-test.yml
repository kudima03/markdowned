name: .NET build & test

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  COVERAGE_WARNING_THRESHOLD: 90
  COVERAGE_THRESHOLD: 80
  MUTATION_THRESHOLD: 60

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet build --no-restore -warnaserror
    - name: Code style check by dotnet format
      run: dotnet format --verify-no-changes
    - name: Code style check by csharpier
      run: dotnet csharpier check .
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    - name: Combine Coverage Reports
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: "**/*.cobertura.xml"
        targetdir: "${{ github.workspace }}"
        reporttypes: "Cobertura"
        verbosity: "Info"
        title: "Code Coverage"
        tag: "${{ github.run_number }}_${{ github.run_id }}"
        toolpath: "reportgeneratortool"
    - name: Create Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "Cobertura.xml"
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: "${{ env.COVERAGE_THRESHOLD }} ${{ env.COVERAGE_WARNING_THRESHOLD }}"
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      continue-on-error: true
      with:
        recreate: true
        path: code-coverage-results.md
    - name: Run mutation test
      run: dotnet stryker --mutation-level Complete --break-at ${{ env.MUTATION_THRESHOLD }}

  aot-smoke:
    name: Native AOT publish smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    - name: Publish Native AOT (trim/AOT warnings fail the build)
      working-directory: ./src
      run: dotnet publish Markdowned.Cli -r linux-x64 -c Release -p:PublishAot=true -warnaserror -o aot
    - name: Run the binary
      run: |
        printf '# Title\n\n| a |\n|---|\n| 1 |\n' > smoke.md
        ./src/aot/Markdowned.Cli --version
        ./src/aot/Markdowned.Cli smoke.md | grep -q '<h1'

  assets:
    name: Vendored web assets are up to date
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Rebuild assets
      working-directory: ./assets
      run: |
        npm ci
        npm run build
    - name: Check that the committed assets match
      run: git diff --exit-code --stat -- src/Markdowned/Assets

  integration:
    name: Chromium integration tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    - name: Cache the pinned headless shell
      uses: actions/cache@v4
      with:
        path: ~/.cache/markdowned
        key: headless-shell-${{ hashFiles('src/Markdowned/Browser/browser.json') }}
    - name: Download the pinned headless shell
      working-directory: ./src
      run: dotnet run --project Markdowned.Cli -- install-browser | tee ../browser-path.txt
    - name: Wrap the browser (the runner has no usable sandbox)
      run: |
        printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$(tail -n 1 browser-path.txt)" > "$RUNNER_TEMP/chrome.sh"
        chmod +x "$RUNNER_TEMP/chrome.sh"
    - name: Test
      working-directory: ./src
      env:
        MARKDOWNED_BROWSER: ${{ runner.temp }}/chrome.sh
      run: dotnet test Tests/Markdowned.Integration.Tests --verbosity normal
